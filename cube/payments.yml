cubes:
  - name: payment_rails
    sql_table: spike.dim_payment_rail
    description: >
      Payment rail catalogue (F### grain). fact.rail_sk joins to id.
      payment_rail is the BC scheme name for grouping (historic F-code bridge).

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: rail_code
        sql: rail_code
        type: string
      - name: rail_name
        sql: rail_name
        type: string
        description: Long portal routing description
      - name: payment_rail
        sql: payment_rail
        type: string
        title: Payment rail
        description: BC scheme name (Faster Payments, SEPA (SCT), Local Clearing, …)
      - name: scheme_family
        sql: scheme_family
        type: string
        description: Same as payment_rail (compat)
      - name: reason
        sql: reason
        type: string
        title: Rail direction
        description: Incoming or Outgoing from BC catalogue / portal description
      - name: source_system
        sql: source_system
        type: string
      - name: active_flag
        sql: active_flag
        type: boolean

    measures:
      - name: count
        type: count

  - name: dates
    sql_table: spike.dim_date
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: calendar_date
        sql: calendar_date
        type: time
      - name: yyyymmdd
        sql: yyyymmdd
        type: number
      - name: year_num
        sql: year_num
        type: number
      - name: month_num
        sql: month_num
        type: number
      - name: quarter_num
        sql: quarter_num
        type: number
    measures:
      - name: count
        type: count

  - name: currencies
    sql_table: spike.dim_currency
    description: >
      Currency catalogue. iso_currency_code + numeric_code are ISO 4217.
      currency_code is the catalogue key (includes non-ISO FX tickers).
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: currency_code
        sql: currency_code
        type: string
        description: Catalogue code (ISO alpha for fiat; ticker for crypto extras)
      - name: iso_currency_code
        sql: iso_currency_code
        type: string
        description: ISO 4217 alphabetic code (null if non-ISO)
      - name: numeric_code
        sql: numeric_code
        type: string
        description: ISO 4217 numeric code
      - name: currency_name
        sql: currency_name
        type: string
      - name: minor_units
        sql: minor_units
        type: number
      - name: is_iso_seed
        sql: is_iso_seed
        type: boolean
    measures:
      - name: count
        type: count

  - name: payment_statuses
    sql_table: spike.dim_payment_status
    description: Lifecycle and raw payment status. One row per status source and source status.

    dimensions:
      - name: payment_status_sk
        sql: payment_status_sk
        type: number
        primary_key: true
      - name: status_source
        sql: status_source
        type: string
      - name: source_status
        sql: source_status
        type: string
      - name: normalised_status
        sql: normalised_status
        type: string
      - name: is_terminal
        sql: is_terminal
        type: boolean
      - name: sort_order
        sql: sort_order
        type: number
      - name: description
        sql: description
        type: string

    measures:
      - name: count
        type: count

  - name: source_statuses
    extends: payment_statuses

  - name: payment_profiles
    sql_table: spike.dim_payment_profile
    description: Direction and resolution flags for one payment.

    dimensions:
      - name: payment_profile_sk
        sql: payment_profile_sk
        type: number
        primary_key: true
      - name: payment_direction
        sql: payment_direction
        type: string
      - name: sca_applied
        sql: sca_applied
        type: boolean
      - name: is_returned
        sql: is_returned
        type: boolean
      - name: is_reversed
        sql: is_reversed
        type: boolean
      - name: account_resolved
        sql: account_resolved
        type: boolean
      - name: rail_resolved
        sql: rail_resolved
        type: boolean

    measures:
      - name: count
        type: count

  - name: failure_reasons
    sql_table: spike.dim_failure_reason

    dimensions:
      - name: failure_reason_sk
        sql: failure_reason_sk
        type: number
        primary_key: true
      - name: reason_source
        sql: reason_source
        type: string
      - name: reason_code
        sql: reason_code
        type: string
      - name: reason_text
        sql: reason_text
        type: string
      - name: category
        sql: category
        type: string

    measures:
      - name: count
        type: count

  - name: payment_types
    sql_table: spike.dim_payment_type

    dimensions:
      - name: payment_type_sk
        sql: payment_type_sk
        type: number
        primary_key: true
      - name: type_source
        sql: type_source
        type: string
      - name: type_code
        sql: type_code
        type: string
      - name: type_label
        sql: type_label
        type: string
      - name: scheme_family
        sql: scheme_family
        type: string

    measures:
      - name: count
        type: count

  - name: country_geo
    sql_table: spike.dim_country_geo
    description: GeoNames Type-1 outrigger on dim_country.

    dimensions:
      - name: country_sk
        sql: country_sk
        type: number
        primary_key: true
      - name: continent_code
        sql: continent_code
        type: string
      - name: continent_name
        sql: continent_name
        type: string
      - name: capital
        sql: capital
        type: string
      - name: population
        sql: population
        type: number
      - name: area_km2
        sql: area_km2
        type: number

    measures:
      - name: count
        type: count

  - name: country_risk
    sql_table: spike.dim_country_risk
    description: Compliance Type-1 country risk outrigger (as-of-now).

    dimensions:
      - name: country_sk
        sql: country_sk
        type: number
        primary_key: true
      - name: final_rating
        sql: final_rating
        type: string
      - name: final_rating_rank
        sql: final_rating_rank
        type: number
      - name: previous_rating_v2
        sql: previous_rating_v2
        type: string
      - name: previous_rating_v1
        sql: previous_rating_v1
        type: string
      - name: mlro_note
        sql: mlro_note
        type: string

    measures:
      - name: count
        type: count

  - name: countries
    sql_table: spike.dim_country

    joins:
      - name: country_geo
        sql: "{CUBE}.country_sk = {country_geo.country_sk}"
        relationship: one_to_one
      - name: country_risk
        sql: "{CUBE}.country_sk = {country_risk.country_sk}"
        relationship: one_to_one

    dimensions:
      - name: country_sk
        sql: country_sk
        type: number
        primary_key: true
      - name: alpha2
        sql: alpha2
        type: string
      - name: alpha3
        sql: alpha3
        type: string
      - name: country_name
        sql: country_name
        type: string
      - name: region
        sql: region
        type: string
      - name: continent_name
        sql: "{country_geo.continent_name}"
        type: string
      - name: population
        sql: "{country_geo.population}"
        type: number
      - name: final_rating
        sql: "{country_risk.final_rating}"
        type: string
      - name: final_rating_rank
        sql: "{country_risk.final_rating_rank}"
        type: number

    measures:
      - name: count
        type: count

  - name: debtor_countries
    extends: countries
    dimensions:
      - name: debtor_code
        sql: alpha2
        type: string
      - name: debtor_final_rating
        sql: "{country_risk.final_rating}"
        type: string
      - name: debtor_continent_name
        sql: "{country_geo.continent_name}"
        type: string

  - name: creditor_countries
    extends: countries
    dimensions:
      - name: creditor_code
        sql: alpha2
        type: string
      - name: creditor_final_rating
        sql: "{country_risk.final_rating}"
        type: string
      - name: creditor_continent_name
        sql: "{country_geo.continent_name}"
        type: string

  - name: value_dates
    extends: dates
    dimensions:
      - name: value_date
        sql: calendar_date
        type: time

  - name: status_updated_dates
    extends: dates
    dimensions:
      - name: status_updated_date
        sql: calendar_date
        type: time

  - name: parties
    sql_table: spike.dim_party
    description: External party. The account number is not stored.

    dimensions:
      - name: party_sk
        sql: party_sk
        type: number
        primary_key: true
      - name: product
        sql: product
        type: string
      - name: display_name
        sql: display_name
        type: string
      - name: display_institution
        sql: display_institution
        type: string
      - name: display_country_code
        sql: display_country_code
        type: string
      - name: client_count
        sql: client_count
        type: number
      - name: name_count
        sql: name_count
        type: number

    measures:
      - name: count
        type: count

  - name: debtor_parties
    extends: parties

  - name: creditor_parties
    extends: parties

  - name: external_parties
    extends: parties

  - name: entity_channels
    sql_table: spike.dim_entity_channel
    description: CLE partner-channel outrigger. Multi-CLE institution = Partner channel.

    dimensions:
      - name: entity_sk
        sql: entity_sk
        type: number
        primary_key: true
      - name: cle_id
        sql: cle_id
        type: string
      - name: cle_name
        sql: cle_name
        type: string
      - name: primary_institution_name
        sql: primary_institution_name
        type: string
      - name: primary_institution_code
        sql: primary_institution_code
        type: string
      - name: partner_name
        sql: partner_name
        type: string
      - name: institution_cle_count
        sql: institution_cle_count
        type: number
      - name: is_partner_channel
        sql: is_partner_channel
        type: boolean
      - name: channel_type
        sql: channel_type
        type: string

    measures:
      - name: count
        type: count

  - name: entities
    sql_table: spike.dim_entity
    description: Legal entity. PSU grain is the client legal entity. fact.entity_sk joins here.

    joins:
      - name: entity_channels
        sql: "{CUBE}.entity_sk = {entity_channels.entity_sk}"
        relationship: one_to_one

    dimensions:
      - name: entity_sk
        sql: entity_sk
        type: number
        primary_key: true
      - name: entity_type
        sql: entity_type
        type: string
      - name: entity_name
        sql: entity_name
        type: string
      - name: entity_status
        sql: entity_status
        type: string
      - name: platform
        sql: platform
        type: string
        description: Legacy column name; same codes as product (prefer product in BI)
      - name: product
        sql: product
        type: string
        description: Business product — B4B | B4S | OVERSIGHT (first-class)
      - name: source_system
        sql: source_system
        type: string
        description: Technical lineage (portal_b4b | portal_b4s | oversight)
      - name: source_pk
        sql: source_pk
        type: string
      - name: b4b_cle_id
        sql: b4b_cle_id
        type: string
      - name: b4s_cle_id
        sql: b4s_cle_id
        type: string
      - name: legal_entity_country
        sql: legal_entity_country
        type: string
      - name: gid_sk
        sql: gid_sk
        type: number
      - name: channel_type
        sql: "{entity_channels.channel_type}"
        type: string
      - name: is_partner_channel
        sql: "{entity_channels.is_partner_channel}"
        type: boolean
      - name: primary_institution_name
        sql: "{entity_channels.primary_institution_name}"
        type: string
      - name: partner_name
        sql: "{entity_channels.partner_name}"
        type: string
      - name: institution_cle_count
        sql: "{entity_channels.institution_cle_count}"
        type: number

    measures:
      - name: count
        type: count

  - name: accounts
    sql_table: spike.dim_account
    description: Currency account. fact.account_sk joins here. Portal rows link to the legal entity.

    joins:
      - name: entities
        sql: "{CUBE}.entity_sk = {entities.entity_sk}"
        relationship: many_to_one

    dimensions:
      - name: account_sk
        sql: account_sk
        type: number
        primary_key: true
      - name: entity_sk
        sql: entity_sk
        type: number
      - name: source_system
        sql: source_system
        type: string
      - name: source_pk
        sql: source_pk
        type: string
      - name: account_name
        sql: account_name
        type: string
      - name: account_status
        sql: account_status
        type: string
      - name: b4b_legal_entity
        sql: b4b_legal_entity
        type: string
        description: B4B regulated entity for the company — UK | US | LT (account grain)
      - name: currency_sk
        sql: currency_sk
        type: number
      - name: bc_company_number
        sql: bc_company_number
        type: string

    measures:
      - name: count
        type: count

  - name: payment_reporting
    sql_table: spike.fact_payment_reporting
    description: >
      Slim FX reporting fact. amount_gbp/eur/usd from as-of FX rates.
      Join 1:1 to payments on payment_sk. Rebuilt when FX ticks.

    dimensions:
      - name: payment_sk
        sql: payment_sk
        type: number
        primary_key: true
      - name: amount_gbp
        sql: amount_gbp
        type: number
      - name: amount_eur
        sql: amount_eur
        type: number
      - name: amount_usd
        sql: amount_usd
        type: number
      - name: fx_matched_gbp
        sql: fx_matched_gbp
        type: boolean
      - name: fx_matched_eur
        sql: fx_matched_eur
        type: boolean
      - name: fx_matched_usd
        sql: fx_matched_usd
        type: boolean

    measures:
      - name: amount_in_gbp
        sql: amount_gbp
        type: sum
        description: Payment volume converted to GBP (as-of FX).
      - name: amount_in_eur
        sql: amount_eur
        type: sum
        description: Payment volume converted to EUR (as-of FX).
      - name: amount_in_usd
        sql: amount_usd
        type: sum
        description: Payment volume converted to USD (as-of FX).

  - name: payments
    sql_table: spike.fact_payment
    description: Payment fact. entity_sk is the legal entity. account_sk is the currency account.

    joins:
      - name: payment_reporting
        sql: "{CUBE}.payment_sk = {payment_reporting.payment_sk}"
        relationship: one_to_one
      - name: entities
        sql: "{CUBE}.entity_sk = {entities.entity_sk}"
        relationship: many_to_one
      - name: accounts
        sql: "{CUBE}.account_sk = {accounts.account_sk}"
        relationship: many_to_one
      - name: payment_rails
        sql: "{CUBE}.rail_sk = {payment_rails.id}"
        relationship: many_to_one
      - name: currencies
        sql: "{CUBE}.currency_sk = {currencies.id}"
        relationship: many_to_one
      - name: dates
        sql: "{CUBE}.date_sk = {dates.id}"
        relationship: many_to_one
      - name: payment_statuses
        sql: "{CUBE}.payment_status_sk = {payment_statuses.payment_status_sk}"
        relationship: many_to_one
      - name: source_statuses
        sql: "{CUBE}.source_status_sk = {source_statuses.payment_status_sk}"
        relationship: many_to_one
      - name: payment_profiles
        sql: "{CUBE}.payment_profile_sk = {payment_profiles.payment_profile_sk}"
        relationship: many_to_one
      - name: failure_reasons
        sql: "{CUBE}.failure_reason_sk = {failure_reasons.failure_reason_sk}"
        relationship: many_to_one
      - name: payment_types
        sql: "{CUBE}.payment_type_sk = {payment_types.payment_type_sk}"
        relationship: many_to_one
      - name: debtor_countries
        sql: "{CUBE}.debtor_country_sk = {debtor_countries.country_sk}"
        relationship: many_to_one
      - name: creditor_countries
        sql: "{CUBE}.creditor_country_sk = {creditor_countries.country_sk}"
        relationship: many_to_one
      - name: value_dates
        sql: "{CUBE}.value_date_sk = {value_dates.id}"
        relationship: many_to_one
      - name: status_updated_dates
        sql: "{CUBE}.status_updated_date_sk = {status_updated_dates.id}"
        relationship: many_to_one
      - name: debtor_parties
        sql: "{CUBE}.debtor_party_sk = {debtor_parties.party_sk}"
        relationship: many_to_one
      - name: creditor_parties
        sql: "{CUBE}.creditor_party_sk = {creditor_parties.party_sk}"
        relationship: many_to_one
      - name: external_parties
        sql: "{external_party} = {external_parties.party_sk}"
        relationship: many_to_one

    dimensions:
      - name: payment_sk
        sql: payment_sk
        type: number
        primary_key: true
      - name: source_system
        sql: source_system
        type: string
        description: Technical lineage (portal_b4b | portal_b4s | oversight)
      - name: product
        sql: product
        type: string
        description: Business product — B4B | B4S | OVERSIGHT. Stored on fact_payment.
      - name: source_payment_id
        sql: source_payment_id
        type: string
      - name: entity_sk
        sql: entity_sk
        type: number
      - name: account_sk
        sql: account_sk
        type: number
      - name: rail_sk
        sql: rail_sk
        type: number
      - name: currency_sk
        sql: currency_sk
        type: number
      - name: date_sk
        sql: date_sk
        type: number
      - name: payment_status
        sql: payment_status
        type: string
        description: Raw Banking Circle or Oversight status. Portal rows are pending or failed.
      - name: payment_direction
        sql: payment_direction
        type: string
      - name: event_ts
        sql: event_ts
        type: time
        description: Booking date. Portal values are midnight.
      - name: status_updated_at
        sql: status_updated_at
        type: time
        description: When the lifecycle status last changed. Null on incoming portal payments.
      - name: activity_ts
        sql: activity_ts
        type: time
        description: >
          Product-line clock. Portal incoming is the deposit created time, else the booking time.
          Portal outgoing is the status time, else the booking time.
          Oversight is the processed time, else created_at.
      - name: sca_applied
        sql: sca_applied
        type: boolean
      - name: external_party
        sql: >
          CASE
            WHEN {CUBE}.creditor_party_sk <> FNV_HASH('~unknown') THEN {CUBE}.creditor_party_sk
            WHEN {CUBE}.debtor_party_sk <> FNV_HASH('~unknown') THEN {CUBE}.debtor_party_sk
            ELSE NULL
          END
        type: number
        description: The role key that is not the unknown token. Null when both roles are unknown.

    measures:
      - name: count
        type: count
      - name: amount_sum
        sql: amount
        type: sum
        description: >
          Native-currency amount. MUST be broken down or filtered by
          currencies.currency_code (or currency_sk). Never use alone.
      - name: amount_gbp
        sql: amount
        type: sum
        description: Native amount where currency is GBP only
        filters:
          - sql: "{currencies.currency_code} = 'GBP'"
      - name: amount_eur
        sql: amount
        type: sum
        description: Native amount where currency is EUR only
        filters:
          - sql: "{currencies.currency_code} = 'EUR'"
      - name: amount_dkk
        sql: amount
        type: sum
        description: Native amount where currency is DKK only
        filters:
          - sql: "{currencies.currency_code} = 'DKK'"
      - name: amount_usd
        sql: amount
        type: sum
        description: Native amount where currency is USD only
        filters:
          - sql: "{currencies.currency_code} = 'USD'"
      - name: amount_in_gbp
        sql: "{payment_reporting.amount_gbp}"
        type: sum
        description: Converted GBP volume via fact_payment_reporting (as-of FX).
      - name: amount_in_eur
        sql: "{payment_reporting.amount_eur}"
        type: sum
        description: Converted EUR volume via fact_payment_reporting (as-of FX).
      - name: amount_in_usd
        sql: "{payment_reporting.amount_usd}"
        type: sum
        description: Converted USD volume via fact_payment_reporting (as-of FX).
      - name: with_account_count
        type: count
        filters:
          - sql: "{CUBE}.account_sk IS NOT NULL"
      - name: with_entity_count
        type: count
        filters:
          - sql: "{CUBE}.entity_sk IS NOT NULL"
      - name: with_rail_count
        type: count
        filters:
          - sql: "{CUBE}.rail_sk IS NOT NULL"
      - name: processed_count
        type: count
        filters:
          - sql: "{payment_statuses.normalised_status} = 'processed'"
      - name: terminal_count
        type: count
        filters:
          - sql: "{payment_statuses.is_terminal} = true"
      - name: success_rate
        sql: "1.0 * {processed_count} / NULLIF({terminal_count}, 0)"
        type: number
        description: Processed payments divided by terminal payments.
      - name: returned_count
        type: count
        filters:
          - sql: "{payment_statuses.normalised_status} = 'returned'"
      - name: return_rate
        sql: "1.0 * {returned_count} / NULLIF({count}, 0)"
        type: number
      - name: failure_count
        type: count
        filters:
          - sql: "{payment_statuses.normalised_status} = 'failed'"
      - name: settlement_latency_p50_hours
        sql: >
          PERCENTILE_CONT(0.5) WITHIN GROUP (
            ORDER BY CASE
              WHEN {CUBE}.status_updated_at IS NULL THEN NULL
              ELSE (EXTRACT(EPOCH FROM {CUBE}.status_updated_at) - EXTRACT(EPOCH FROM {CUBE}.event_ts)) / 3600.0
            END
          )
        type: number
        description: Median hours from the booking date to status_updated_at. The start is the booking date. Rows with no status time are left out.
      - name: settlement_latency_p95_hours
        sql: >
          PERCENTILE_CONT(0.95) WITHIN GROUP (
            ORDER BY CASE
              WHEN {CUBE}.status_updated_at IS NULL THEN NULL
              ELSE (EXTRACT(EPOCH FROM {CUBE}.status_updated_at) - EXTRACT(EPOCH FROM {CUBE}.event_ts)) / 3600.0
            END
          )
        type: number
        description: 95th percentile hours from the booking date to status_updated_at. The start is the booking date. Rows with no status time are left out.
      - name: distinct_counterparties
        sql: "{external_party}"
        type: count_distinct
        description: Distinct external parties. The unknown token is excluded. A party that pays and receives is one party.
