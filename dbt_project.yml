name: b4b_models
version: 1.0.0
config-version: 2
# UAT still runs dbt 1.12.6. The range includes dbt v2 so the VS Code
# extension language server can load this project. dbt cannot express
# "1.12 or 2.x, excluding 1.13" as one version range.
require-dbt-version: [">=1.12.0", "<3.0.0"]

flags:
  send_anonymous_usage_stats: false
  use_colors: true

profile: b4b_models

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets: [target, dbt_packages]

models:
  b4b_models:
    +materialized: table
    +static_analysis: strict
    mart:
      +schema: spike
      +materialized: table

data_tests:
  b4b_models:
    +static_analysis: strict

sources:
  b4b_models:
    +static_analysis: strict

seeds:
  b4b_models:
    +schema: spike
    +quote_columns: false

vars:
  # fact_card_txn history window (demo cut: from 2025-01-01; open end).
  card_txn_week_start: "2025-01-01"
  card_txn_week_end: "2099-12-31"
  # Incremental ticks only rewrite this many trailing calendar days (not full history).
  card_txn_incremental_lookback_days: 7
