version: 2

models:
  - name: dim_vessel
    description: >
      One hull (vessel asset) from Grid coverage book. Prototype production
      Subaccount/asset under CLE. cle_gid is money-holder CLE GID when present.
    columns:
      - name: vessel_sk
        data_tests: [unique, not_null]
      - name: hull_key
        data_tests: [not_null]
      - name: psu_or_subaccount
        data_tests:
          - accepted_values:
              arguments:
                values: ['psu', 'subaccount', 'mixed']

  - name: dim_account_vessel
    description: >
      Yachting float outrigger on dim_account. float_type operational|apa|project
      (refit not split in 2026-10-15 export). Null for non-vessel accounts (absent).
    columns:
      - name: account_sk
        data_tests: [unique, not_null]
      - name: float_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['operational', 'apa', 'project']

  - name: dim_gid
    description: >
      One row per global identifier. Identifiers are not invented.
      Warehouse overlay adds gid_type (orchestrator has parent_id but no type):
      Partner | PSU | Subaccount (asset under a CLE).
    columns:
      - name: gid_sk
        description: Integer primary key
        data_tests: [unique, not_null]
      - name: gid
        description: Natural key
        data_tests: [unique, not_null]
      - name: parent_gid_sk
        description: Parent GID in the orchestrator hierarchy (resolved from parent_id)
      - name: gid_type
        description: Partner | PSU | Subaccount. Null when unclassified (root, no CLE, no children).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Partner', 'PSU', 'Subaccount']
              config:
                where: "gid_type is not null"

  - name: dim_entity
    description: One organisational entity. PSU grain is the client legal entity on B4B or Bread for Scrap. Agent and Intermediate are included. Reporting product is B4B | B4S | OVERSIGHT (column `platform` today; prefer name `product` in BI).
    columns:
      - name: entity_sk
        data_tests: [unique, not_null]
      - name: entity_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Agent', 'Intermediate', 'PSU', 'TSP', 'Partner']
      - name: platform
        description: Product codes B4B | B4S | OVERSIGHT (reporting name is product; rename planned)
      - name: source_system
        data_tests: [not_null]
      - name: source_pk
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, entity_type, source_pk]
          config:
            enabled: false

  - name: dim_account
    description: One company or float account. Portal rows resolve entity_sk to the client legal entity.
    columns:
      - name: account_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests: [not_null]
      - name: source_pk
        data_tests: [not_null]
      - name: entity_sk
        description: Foreign key to dim_entity. Required for B4B and Bread for Scrap accounts.
        data_tests:
          - not_null:
              config:
                where: "source_system in ('portal_b4b', 'portal_b4s')"
      - name: b4b_legal_entity
        description: >
          B4B regulated entity for the company float — UK | US | LT from
          portal companies.legal_entity_country. Account grain (not CLE).
          Null for Oversight and unresolved accounts.

  - name: fact_payment
    description: >
      One portal payment notification (B4B or Bread for Scrap) or one Oversight payment.
      entity_sk is the legal entity. account_sk is the currency account.
      Portal account is COALESCE(payment company, deposit company, viban company).
    columns:
      - name: payment_sk
        description: Stable FNV hash of source_system and source_payment_id. Not a 1..N sequence.
        data_tests:
          - not_null
          - unique:
              config:
                tags: ['weekly_reconcile']
      - name: batch_run_id
        description: Pipeline run that last wrote the row. Empty on a manual full refresh.
      - name: source_system
        data_tests: [not_null]
      - name: source_payment_id
        data_tests: [not_null]
      - name: amount
        description: Additive measure in transaction currency
        data_tests: [not_null]
      - name: payment_status_sk
        description: Lifecycle status. Portal outgoing uses payments.status. Incoming uses Banking Circle flags.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_status')
                field: payment_status_sk
      - name: source_status_sk
        description: Raw Banking Circle or Oversight status.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_status')
                field: payment_status_sk
      - name: payment_profile_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_profile')
                field: payment_profile_sk
              config:
                severity: warn
      - name: failure_reason_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_failure_reason')
                field: failure_reason_sk
              config:
                severity: warn
      - name: payment_type_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_sk
              config:
                severity: warn
      - name: debtor_party_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_party')
                field: party_sk
              config:
                severity: warn
      - name: creditor_party_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_party')
                field: party_sk
              config:
                severity: warn
      - name: debtor_country_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_sk
              config:
                severity: warn
      - name: creditor_country_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_sk
              config:
                severity: warn
      - name: entity_sk
        description: Legal entity, via the account
      - name: account_sk
        description: Currency account. Null when no company can be resolved.
        data_tests:
          - not_null:
              config:
                where: "source_system in ('portal_b4b', 'portal_b4s')"
                severity: warn
      - name: date_sk
        data_tests:
          - relationships:
              arguments:
                to: source('spike_live', 'dim_date')
                field: id
              config:
                severity: warn
      - name: currency_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('spike_live', 'dim_currency')
                field: id
              config:
                severity: warn
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "status_updated_date_sk is null or transaction_date_sk is null or status_updated_date_sk >= transaction_date_sk"
          config:
            severity: warn
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, source_payment_id]
          config:
            tags: ['weekly_reconcile']

  - name: dim_payment_status
    columns:
      - name: payment_status_sk
        data_tests: [unique, not_null]
      - name: normalised_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['processed', 'pending', 'rejected', 'returned', 'reversed', 'failed', '~unknown']

  - name: dim_payment_profile
    columns:
      - name: payment_profile_sk
        data_tests: [unique, not_null]

  - name: dim_failure_reason
    columns:
      - name: failure_reason_sk
        data_tests: [unique, not_null]

  - name: dim_payment_type
    columns:
      - name: payment_type_sk
        data_tests: [unique, not_null]

  - name: dim_country
    columns:
      - name: country_sk
        data_tests: [unique, not_null]
      - name: alpha2
        data_tests: [unique, not_null]

  - name: dim_risk_rating
    description: Ordered B4B financial-crime country risk labels.
    columns:
      - name: rating_code
        data_tests: [unique, not_null]
      - name: rating_rank
        data_tests: [unique, not_null]

  - name: dim_country_geo
    description: Type-1 GeoNames outrigger on dim_country (continent, population, capital, …).
    columns:
      - name: country_sk
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_sk

  - name: dim_country_risk
    description: Type-1 Compliance country risk outrigger (demo Master Sheet v3). As-of-now only.
    columns:
      - name: country_sk
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_sk
      - name: final_rating
        data_tests: [not_null]

  - name: dim_jurisdiction
    description: Non-ISO jurisdictions from Compliance sheet (XK, occupied UA, PT islands).
    columns:
      - name: jurisdiction_sk
        data_tests: [unique, not_null]
      - name: jurisdiction_code
        data_tests: [unique, not_null]

  - name: dim_entity_channel
    description: >
      CLE outrigger for Partners BI. Primary institution plus partner-channel flag
      when that institution hosts more than one CLE.
    columns:
      - name: entity_sk
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_entity')
                field: entity_sk
      - name: is_partner_channel
        data_tests: [not_null]

  - name: dim_party
    columns:
      - name: party_sk
        data_tests: [unique, not_null]

  - name: dim_card
    description: One portal card. Account comes from the card user company. PAN is not stored.
    columns:
      - name: card_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['portal_b4b', 'portal_b4s']
      - name: source_card_id
        data_tests: [not_null]

  - name: dim_cardholder
    columns:
      - name: cardholder_sk
        data_tests: [unique, not_null]

  - name: dim_card_product
    columns:
      - name: card_product_sk
        data_tests: [unique, not_null]

  - name: dim_card_scheme
    columns:
      - name: card_scheme_sk
        data_tests: [unique, not_null]
      - name: scheme_code
        data_tests: [unique, not_null]

  - name: dim_processor
    columns:
      - name: processor_sk
        data_tests: [unique, not_null]
      - name: processor_code
        data_tests: [unique, not_null]

  - name: dim_mcc
    description: Standard merchant category codes with a coarse bank-style mcc_group.
    columns:
      - name: mcc_sk
        data_tests: [unique, not_null]
      - name: mcc_code
        data_tests: [unique, not_null]

  - name: fact_card_txn
    description: >
      Derived card-transaction outcomes. Presentment = one FinId (auth optional).
      Decline = EHI decline with no FinId. Auth vs fin lookalike amounts stay separate.
      Native amount columns stay on this fact; Cards BI amounts come from
      fact_card_txn_reporting (as-of FX). product and event_ts support Cards BI filters.
    columns:
      - name: card_txn_sk
        data_tests: [unique, not_null]
      - name: card_txn_nk
        data_tests: [unique, not_null]
      - name: txn_outcome
        data_tests:
          - accepted_values:
              arguments:
                values: ['presentment', 'decline']
      - name: product
        description: B4B | B4S | OVERSIGHT when resolvable from posting, portal source, or entity/account.
        data_tests:
          - accepted_values:
              arguments:
                values: ['B4B', 'B4S', 'OVERSIGHT']
                config:
                  where: "product is not null"
      - name: b4b_legal_entity
        description: UK | US | LT denormalised from dim_account for Cards BI filters (no join).
      - name: company_name
        description: Account display name denormalised from dim_account.
      - name: entity_name
        description: Legal entity display name denormalised from dim_entity.
      - name: event_ts
        description: Coalesced presentment / EHI / posting / auth UTC clock for time filters.
      - name: missing_auth
        description: 1 when presentment has no auth_sk.
      - name: missing_posting
        description: 1 when presentment has no posting_sk.
      - name: decline_missing_auth
        description: 1 when decline has no auth_sk.
      - name: processor_sk
        description: First-class processor family (not the same as source_system feed arm).

  - name: fact_card_txn_reporting
    description: >
      Slim as-of FX companion for fact_card_txn (same spine as payments).
      Grain one card_txn_sk. settlement_amount_eur/gbp/usd and fee_amount_*.
      Cards BI must use these consolidated amounts — never sum mixed natives.
    columns:
      - name: card_txn_sk
        data_tests: [unique, not_null]

  - name: fact_card_load_reporting
    description: As-of FX companion for fact_card_load. amount_eur/gbp/usd.
    columns:
      - name: load_sk
        data_tests: [unique, not_null]

  - name: fact_card_balance_posting_reporting
    description: As-of FX companion for fact_card_balance_posting (ledger spend).
    columns:
      - name: posting_sk
        data_tests: [unique, not_null]

  - name: fact_card_authorisation
    description: GPS authorisations, including declines. Not scheme settlement.
    columns:
      - name: auth_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['gps_mc', 'gps_visa']

  - name: fact_card_financial
    description: Scheme settlement. One GPS presentment. The only settlement total.
    columns:
      - name: financial_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['gps_mc', 'gps_visa']

  - name: fact_card_fee
    description: Scheme fees from GPS CardFee only.
    columns:
      - name: fee_sk
        data_tests: [unique, not_null]

  - name: fact_card_balance_posting
    description: Customer-ledger spend. Financial rows that post to the balance.
    columns:
      - name: posting_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['portal_b4b', 'portal_b4s']

  - name: fact_card_ehi_observation
    description: EHI observations. Amounts are observed_ and are not scheme or ledger measures.
    columns:
      - name: observation_sk
        data_tests: [unique, not_null]

  - name: fact_card_load
    description: Portal loads and GPS load confirmations, kept apart by source_system.
    columns:
      - name: load_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['portal_b4b', 'portal_b4s', 'gps_mc', 'gps_visa']

  - name: bridge_card_lifecycle_match
    description: Links between card evidence. Amounts are not stored here.
    columns:
      - name: match_sk
        data_tests: [unique, not_null]
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['traceid_lifecycle', 'transaction_link', 'fin_id_to_txn_id', 'auth_id_to_txn_id', 'processor_ref']

  - name: fct_card_transaction_snapshot
    description: Current lifecycle state and counts. Summable amounts stay on the atomic facts.
    columns:
      - name: snapshot_sk
        data_tests: [unique, not_null]
      - name: lifecycle_state
        data_tests:
          - accepted_values:
              arguments:
                values: ['observed_ehi', 'confirmed_gps', 'unmatched', 'reversed', 'chargeback']

  - name: fact_exchange_rate_daily
    description: >
      Yahoo mid rate per calendar day, from/to currency, and vendor.
      PassFort fx_daily_rates via stg_passfort_fx_daily_rates. Reporting conversion only.
      Not stored on fact_payment — FX arrives late relative to payments.
    columns:
      - name: fx_rate_daily_sk
        description: Stable FNV hash of from, to, date_sk, vendor.
        data_tests: [not_null]
      - name: date_sk
        data_tests: [not_null]
      - name: from_currency_sk
        data_tests: [not_null]
      - name: to_currency_sk
        data_tests: [not_null]
      - name: vendor
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['yahoo']
      - name: rate
        data_tests: [not_null]
      - name: source_updated_at
        description: PassFort fx_daily_rates.updated_at; incremental watermark.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [from_currency_sk, to_currency_sk, date_sk, vendor]
          config:
            tags: ['weekly_reconcile']

  - name: fact_payment_reporting
    description: >
      Slim reporting fact. One row per payment_sk with amount_gbp/eur/usd
      from the as-of FX spine. Incremental on changed payments; a rate change
      restates the affected keys. Never bake these onto fact_payment.
      Every row must convert to GBP, EUR, and USD — null amounts or unmatched
      FX paths fail the suite (see tests/fact_payment_reporting_*.sql).
    columns:
      - name: payment_sk
        data_tests: [unique, not_null]
      - name: currency_sk
        data_tests: [not_null]
      - name: date_sk
        data_tests: [not_null]
      - name: source_currency
        data_tests: [not_null]
      - name: amount_gbp
        description: Native amount converted to GBP; must never be null.
        data_tests: [not_null]
      - name: amount_eur
        description: Native amount converted to EUR; must never be null.
        data_tests: [not_null]
      - name: amount_usd
        description: Native amount converted to USD; must never be null.
        data_tests: [not_null]
      - name: fx_matched_gbp
        data_tests: [not_null]
      - name: fx_matched_eur
        data_tests: [not_null]
      - name: fx_matched_usd
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              fx_matched_gbp and fx_matched_eur and fx_matched_usd
              and amount_gbp is not null and amount_eur is not null and amount_usd is not null

  - name: v_fact_payment_amount_eur
    description: Interim EUR-only spike. Prefer fact_payment_reporting.
    columns:
      - name: payment_sk
        data_tests: [not_null]
