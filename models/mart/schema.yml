version: 2

models:
  - name: dim_gid
    description: One row per global identifier. Identifiers are not invented.
    columns:
      - name: gid_sk
        description: Integer primary key
        data_tests: [unique, not_null]
      - name: gid
        description: Natural key
        data_tests: [unique, not_null]

  - name: dim_entity
    description: One organisational entity. PSU grain is the client legal entity on B4B or Bread for Scrap. Agent and Intermediate are included. Reporting product is B4B | B4S | OVERSIGHT (column `platform` today; prefer name `product` in BI).
    columns:
      - name: entity_sk
        data_tests: [unique, not_null]
      - name: entity_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Agent', 'Intermediate', 'PSU', 'TSP']
      - name: platform
        description: Product codes B4B | B4S | OVERSIGHT (reporting name is product; rename planned)
      - name: source_system
        data_tests: [not_null]
      - name: source_pk
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, entity_type, source_pk]
          config:
            enabled: false

  - name: dim_account
    description: One company or float account. Portal rows resolve entity_sk to the client legal entity.
    columns:
      - name: account_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests: [not_null]
      - name: source_pk
        data_tests: [not_null]
      - name: entity_sk
        description: Foreign key to dim_entity. Required for B4B and Bread for Scrap accounts.
        data_tests:
          - not_null:
              config:
                where: "source_system in ('portal_b4b', 'portal_b4s')"

  - name: fact_payment
    description: >
      One portal payment notification (B4B or Bread for Scrap) or one Oversight payment.
      entity_sk is the legal entity. account_sk is the currency account.
      Portal account is COALESCE(payment company, deposit company, viban company).
    columns:
      - name: payment_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests: [not_null]
      - name: source_payment_id
        data_tests: [not_null]
      - name: amount
        description: Additive measure in transaction currency
      - name: entity_sk
        description: Legal entity, via the account
      - name: account_sk
        description: Currency account. Null when no company can be resolved.
        data_tests:
          - not_null:
              config:
                where: "source_system in ('portal_b4b', 'portal_b4s')"
                severity: warn
      - name: date_sk
        data_tests:
          - relationships:
              arguments:
                to: source('spike_live', 'dim_date')
                field: id
              config:
                severity: warn
      - name: currency_sk
        data_tests:
          - relationships:
              arguments:
                to: source('spike_live', 'dim_currency')
                field: id
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, source_payment_id]
          config:
            enabled: false

  - name: dim_card
    description: One portal card. Account comes from the card user company. PAN is not stored.
    columns:
      - name: card_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['portal_b4b', 'portal_b4s']
      - name: source_card_id
        data_tests: [not_null]

  - name: dim_cardholder
    columns:
      - name: cardholder_sk
        data_tests: [unique, not_null]

  - name: dim_card_product
    columns:
      - name: card_product_sk
        data_tests: [unique, not_null]

  - name: dim_card_scheme
    columns:
      - name: card_scheme_sk
        data_tests: [unique, not_null]
      - name: scheme_code
        data_tests: [unique, not_null]

  - name: dim_processor
    columns:
      - name: processor_sk
        data_tests: [unique, not_null]
      - name: processor_code
        data_tests: [unique, not_null]

  - name: fact_card_authorisation
    description: GPS authorisations, including declines. Not scheme settlement.
    columns:
      - name: auth_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['gps_mc', 'gps_visa']

  - name: fact_card_financial
    description: Scheme settlement. One GPS presentment. The only settlement total.
    columns:
      - name: financial_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['gps_mc', 'gps_visa']

  - name: fact_card_fee
    description: Scheme fees from GPS CardFee only.
    columns:
      - name: fee_sk
        data_tests: [unique, not_null]

  - name: fact_card_balance_posting
    description: Customer-ledger spend. Financial rows that post to the balance.
    columns:
      - name: posting_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['portal_b4b', 'portal_b4s']

  - name: fact_card_ehi_observation
    description: EHI observations. Amounts are observed_ and are not scheme or ledger measures.
    columns:
      - name: observation_sk
        data_tests: [unique, not_null]

  - name: fact_card_load
    description: Portal loads and GPS load confirmations, kept apart by source_system.
    columns:
      - name: load_sk
        data_tests: [unique, not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['portal_b4b', 'portal_b4s', 'gps_mc', 'gps_visa']

  - name: bridge_card_lifecycle_match
    description: Links between card evidence. Amounts are not stored here.
    columns:
      - name: match_sk
        data_tests: [unique, not_null]
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['traceid_lifecycle', 'transaction_link', 'fin_id_to_txn_id', 'auth_id_to_txn_id', 'processor_ref']

  - name: fct_card_transaction_snapshot
    description: Current lifecycle state and counts. Summable amounts stay on the atomic facts.
    columns:
      - name: snapshot_sk
        data_tests: [unique, not_null]
      - name: lifecycle_state
        data_tests:
          - accepted_values:
              arguments:
                values: ['observed_ehi', 'confirmed_gps', 'unmatched', 'reversed', 'chargeback']
