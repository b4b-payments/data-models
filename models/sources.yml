version: 2

sources:
  - name: spike_stg
    description: Landed source tables in schema spike. Read-only for these models.
    schema: spike
    tables:
      - name: stg_orchestrator_global_identifiers
        description: Global identifier registry
      - name: stg_b4b_client_legal_entities
        description: Client legal entities. This is the PSU grain.
      - name: stg_b4b_companies
        description: Portal companies. Each row is a currency account.
      - name: stg_b4b_enterprises
        description: Portal enterprises (Partner). Warehouse GID augment source.
      - name: stg_b4b_institutions
        description: Institutions (Intermediate)
      - name: stg_b4b_banking_circle_transaction_notifications
        description: Portal payment notifications. This is the portal payment grain.
      - name: stg_b4b_payments
        description: Portal payments, used to attach a company to a notification
      - name: stg_b4b_company_deposits
        description: Portal deposits, used to attach a company to a notification
      - name: stg_b4b_vibans
      - name: stg_b4b_companies_vibans
      - name: stg_b4s_client_legal_entities
        description: Bread for Scrap client legal entities. PSU grain for that portal.
      - name: stg_b4s_companies
        description: Bread for Scrap companies. Each row is a currency account.
      - name: stg_b4s_enterprises
        description: Bread for Scrap enterprises (Partner).
      - name: stg_b4s_institutions
        description: Bread for Scrap institutions (Intermediate)
      - name: stg_b4s_banking_circle_transaction_notifications
        description: Bread for Scrap payment notifications. Same grain as the B4B notifications.
      - name: stg_b4s_payments
        description: Bread for Scrap payments, used to attach a company to a notification
      - name: stg_b4s_company_deposits
        description: Bread for Scrap deposits, used to attach a company to a notification
      - name: stg_b4s_vibans
      - name: stg_b4s_companies_vibans
      - name: stg_oversight_clients
        description: Oversight agents
      - name: stg_oversight_companies
        description: Oversight companies (accounts)
      - name: stg_oversight_payments
        description: Oversight payments
      - name: stg_bc_banking_circle_routing_codes
        description: Routing catalogue for rails
      - name: stg_b4b_cards
      - name: stg_b4s_cards
      - name: stg_b4b_cardholders
      - name: stg_b4s_cardholders
      - name: stg_b4b_card_products
      - name: stg_b4s_card_products
      - name: stg_b4b_users
        description: Portal users, id and company_id only
      - name: stg_b4s_users
        description: Bread for Scrap users, id and company_id only
      - name: stg_b4b_card_transactions
      - name: stg_b4s_card_transactions
      - name: stg_b4b_card_loads
      - name: stg_b4s_card_loads
      - name: stg_b4b_card_unloads
      - name: stg_b4s_card_unloads
      - name: stg_gps_mc_card_authorisation
      - name: stg_gps_mc_card_financial
      - name: stg_gps_mc_card_fee
      - name: stg_gps_mc_card_load_unload
      - name: stg_gps_visa_card_authorisation
      - name: stg_gps_visa_card_financial
      - name: stg_gps_visa_card_fee
      - name: stg_gps_visa_card_load_unload
      - name: stg_passfort_fx_instruments
        description: Yahoo FX instrument catalogue from PassFort (sync-fx-rates).
      - name: stg_passfort_fx_daily_rates
        description: Yahoo day mid rates from PassFort (sync-fx-rates). Grain (pair, rate_date).
      - name: stg_geonames_country
        description: GeoNames countryInfo dump (file pipeline). Grain iso2.
      - name: stg_compliance_country_risk
        description: Compliance Master Sheet v3 ISO countries (demo file load). Grain iso_code alpha2.
      - name: stg_compliance_country_jurisdiction
        description: Compliance Master Sheet non-ISO / subdivision codes (XK, UA-*, PT-*).
      - name: stg_vessel_hull_coverage
        description: >
          Vessel book hull grain from Grid coverage 2026-10-15 (file load).
          psu_or_subaccount + CLE gid; not a live DMS feed.
      - name: stg_vessel_float_coverage
        description: >
          Exploded float/company rows from the same coverage (company_id, float_type,
          jurisdiction, open/closed). Vessel-only.

  - name: spike_ops
    description: Pipeline control tables written by the payments CDC runner.
    schema: spike
    tables:
      - name: pipeline_changed_key
        description: Source keys a micro-batch must reprocess in fact_payment.
        columns:
          - name: run_id
          - name: source_system
          - name: key_role
          - name: business_key

  - name: spike_live
    description: Reference dimensions built by sql/ in this repo
    schema: spike
    tables:
      - name: dim_payment_rail
      - name: dim_currency
      - name: dim_date

  - name: spike_fx
    description: As-of FX spine maintained by the FX cron. Not rebuilt by dbt.
    schema: spike
    tables:
      - name: fx_rate_spine
